<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MERLOW: UNFILTERED</title>
<meta name="description" content="Made to order and shipped worldwide.">
<meta name="theme-color" content="#0A0B0D">
<link rel="icon" href="/media/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/media/favicon.png" sizes="256x256" type="image/png">
<link rel="apple-touch-icon" href="/media/favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@300;400;500;600&family=Saira+Stencil+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="page">

<header class="pagehead">
  <div class="wrap pagehead__inner">
    <a class="pagehead__home" href="/">
      <img src="/media/merlow-wordmark.png" alt="MERLOW" width="640" height="150">
    </a>
    <nav class="pagehead__nav" aria-label="Shop">
      <a href="/#story">The record</a>
      <a href="/shop">Shop</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="crumb"><a href="/shop">&larr; All merchandise</a></p>
  </div>

  <article class="product" id="product" aria-live="polite">
    <div class="wrap">
      <p class="shop__status">Loading&hellip;</p>
    </div>
  </article>
</main>

<footer class="pagefoot">
  <div class="wrap pagefoot__inner">
    <p>&copy; <span id="year"></span> MERLOW. Made to order by Printful.</p>
    <a href="/">Back to the record</a>
  </div>
</footer>

<script src="/js/reveal.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/product.js"></script>
</body>
</html>
